name: Copilot Agent Setup

# This workflow defines the environment setup steps for GitHub Copilot Coding Agent.
# When Copilot is assigned an issue, it uses these steps to prepare its workspace.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-asyncio pydantic ruff

      - name: Install Azure CLI + Bicep
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install

      - name: Verify environment
        run: |
          python --version
          az bicep version
          ruff --version
          pytest --version

name: CI — Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Check linting
        run: ruff check src/ tests/

  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-asyncio pytest-cov pydantic

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short 2>/dev/null || echo "No unit tests found yet"

      - name: Run contract tests
        run: pytest tests/contract/ -v --tb=short 2>/dev/null || echo "No contract tests found yet"

  bicep-validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          az bicep install
          az bicep version

      - name: Lint Bicep templates
        run: az bicep lint --file infra/main.bicep 2>&1 || true

      - name: Build ARM JSON (verify compilation)
        run: |
          az bicep build --file infra/main.bicep --outfile infra/main.compiled.json
          echo "✅ Bicep compiles successfully"

      - name: Check ARM JSON is up to date
        run: |
          if ! diff -q infra/main.json infra/main.compiled.json > /dev/null 2>&1; then
            echo "⚠️  infra/main.json is out of date! Run: az bicep build --file infra/main.bicep --outfile infra/main.json"
            exit 1
          fi
          echo "✅ ARM JSON is up to date"

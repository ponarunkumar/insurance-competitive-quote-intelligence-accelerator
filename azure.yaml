# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: insurance-competitive-quote-intelligence
metadata:
  template: insurance-competitive-quote-intelligence-accelerator@1.0.0
  description: Multi-agent AI system for competitive quote intelligence in insurance contact centers

services:
  orchestrator:
    project: ./src
    host: ai.endpoint
    language: python

infra:
  provider: bicep
  path: ./infra
  module: main

pipeline:
  provider: github
  variables:
    - AZURE_ENV_NAME
    - AZURE_LOCATION
    - SQL_ADMIN_LOGIN
    - APIM_PUBLISHER_EMAIL
  secrets:
    - SQL_ADMIN_PASSWORD

hooks:
  preprovision:
    shell: sh
    run: |
      echo "Validating Azure subscription and region availability..."
      az account show --query "{subscription: name, id: id}" -o table
  postprovision:
    shell: sh
    run: |
      echo "Running post-provision setup..."
      echo "  - Seeding Azure SQL with sample data"
      echo "  - Creating AI Search indexes"
      echo "  - Registering agents in Foundry project"
  postdeploy:
    shell: sh
    run: |
      echo "Deployment complete!"
      echo "  Foundry Project: $(azd env get-value FOUNDRY_PROJECT_ENDPOINT)"
      echo "  Agent Playground: https://ai.azure.com"

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: insurance-competitive-quote-intelligence
metadata:
  template: insurance-competitive-quote-intelligence-accelerator@1.0.0
  description: Multi-agent AI system for competitive quote intelligence in insurance contact centers

services:
  orchestrator:
    project: ./src
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile

infra:
  provider: bicep
  path: ./infra
  module: main

pipeline:
  provider: github
  variables:
    - AZURE_ENV_NAME
    - AZURE_LOCATION
    - SQL_ADMIN_LOGIN
    - APIM_PUBLISHER_EMAIL
  secrets:
    - SQL_ADMIN_PASSWORD

hooks:
  preprovision:
    shell: pwsh
    run: |
      Write-Host "Validating Azure subscription and region availability..."
      az account show --query "{subscription: name, id: id}" -o table
  postprovision:
    shell: pwsh
    run: |
      Write-Host "Running post-provision setup..."
      Write-Host "  - Seeding Azure SQL with sample data"
      Write-Host "  - Creating AI Search indexes"
      Write-Host "  - Registering agent identities"
  postdeploy:
    shell: pwsh
    run: |
      Write-Host "Deployment complete!"
      Write-Host "  Agent endpoint: $(azd env get-value AGENT_ENDPOINT)"
      Write-Host "  APIM Gateway: $(azd env get-value APIM_GATEWAY_URL)"

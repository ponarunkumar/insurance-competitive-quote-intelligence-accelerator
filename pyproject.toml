[project]
name = "insurance-competitive-quote-intelligence"
version = "1.0.0"
description = "Multi-agent AI system for competitive quote intelligence in insurance contact centers"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Microsoft Foundry SDK (primary)
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.17.0",
    # Microsoft Agent Framework (hosted agents)
    "agent-framework>=0.3.0",
    "agent-framework-foundry-hosting>=1.0.0a0",
    # Azure AI Services
    "azure-search-documents>=11.6.0",
    "azure-cognitiveservices-speech>=1.40.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-textanalytics>=5.3.0",
    "azure-communication-callautomation>=1.3.0",
    "azure-cosmos>=4.7.0",
    # Observability
    "azure-monitor-opentelemetry>=1.6.0",
    # Data & Utilities
    "pyodbc>=5.1.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
